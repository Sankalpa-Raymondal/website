<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sankalpa Raymondal's Movies</title>
    <!-- Old links were entry.html?p=<name>; entries are now <name>.html (see build.js) -->
    <script>
        const p = new URLSearchParams(location.search).get("p");
        location.replace(p && /^[\w-]+$/.test(p) ? `${p}.html` : "index.html");
    </script>
</head>
<body>
    <p><a href="index.html">Go to Movies</a></p>
</body>
</html>
